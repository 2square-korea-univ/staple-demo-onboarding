<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">STAPLE value flow</title>
  <desc id="desc">If a release snapshot enables asset entry, StapleATM and RIAVault coordinate entry if enabled, strategy deployment if active, NAV updates, and policy-gated hedge purchases.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d8dee8; stroke-width: 2; }
      .blue { fill: #e8f1ff; stroke: #1f6feb; }
      .gold { fill: #fff6d8; stroke: #d4a017; }
      .orange { fill: #fff0df; stroke: #f7931a; }
      .green { fill: #e8f7ef; stroke: #1f9d55; }
      .title { font: 700 18px Inter, Arial, sans-serif; fill: #111827; }
      .body { font: 13px Inter, Arial, sans-serif; fill: #526071; }
      .label { font: 700 13px Inter, Arial, sans-serif; fill: #334155; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="540" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">How STAPLE Converts Complexity Into One Holding Experience</text>
  <text x="60" y="88" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5b6472">If release-enabled, asset entry, yield handling, NAV accounting, and policy-gated hedge purchases stay inside the protocol.</text>

  <rect class="box blue" x="70" y="160" width="170" height="100" rx="14"/>
  <text class="title" x="155" y="198" text-anchor="middle">Users</text>
  <text class="body" x="155" y="224" text-anchor="middle">Asset if enabled</text>
  <text class="body" x="155" y="244" text-anchor="middle">entry if enabled</text>

  <rect class="box" x="310" y="160" width="180" height="100" rx="14"/>
  <text class="title" x="400" y="198" text-anchor="middle">StapleATM</text>
  <text class="body" x="400" y="224" text-anchor="middle">Release-gated entry</text>
  <text class="body" x="400" y="244" text-anchor="middle">and exit surface</text>

  <rect class="box green" x="560" y="150" width="210" height="120" rx="14"/>
  <text class="title" x="665" y="190" text-anchor="middle">RIAVault</text>
  <text class="body" x="665" y="216" text-anchor="middle">Internal accounting</text>
  <text class="body" x="665" y="236" text-anchor="middle">supply updates if enabled</text>

  <rect class="box" x="850" y="125" width="190" height="86" rx="14"/>
  <text class="title" x="945" y="160" text-anchor="middle">Yield Strategies</text>
  <text class="body" x="945" y="185" text-anchor="middle">Aave / Spark / Compound if active</text>

  <rect class="box gold" x="850" y="285" width="190" height="86" rx="14"/>
  <text class="title" x="945" y="312" text-anchor="middle">Policy-Gated</text>
  <text class="title" x="945" y="336" text-anchor="middle">Hedge Assets</text>
  <text class="body" x="945" y="360" text-anchor="middle">Gold / Bitcoin if enabled</text>

  <rect class="box orange" x="560" y="350" width="210" height="96" rx="14"/>
  <text class="title" x="665" y="386" text-anchor="middle">STAPLE Token</text>
  <text class="body" x="665" y="412" text-anchor="middle">User-facing claim on</text>
  <text class="body" x="665" y="432" text-anchor="middle">the reserve basket</text>

  <path class="line" d="M 240 210 L 302 210"/>
  <path class="line" d="M 490 210 L 552 210"/>
  <path class="line" d="M 770 184 L 842 168"/>
  <path class="line" d="M 945 211 L 945 277"/>
  <path class="line" d="M 850 328 C 790 328 790 246 770 234"/>
  <path class="line" d="M 665 270 L 665 342"/>
  <path class="line" d="M 560 398 C 410 398 280 320 170 260"/>

  <text class="label" x="270" y="196" text-anchor="middle">assets if enabled</text>
  <text class="label" x="526" y="196" text-anchor="middle">entry if enabled</text>
  <text class="label" x="810" y="151" text-anchor="middle">deploy if active</text>
  <text class="label" x="972" y="252" text-anchor="middle">harvest if active</text>
  <text class="label" x="807" y="303" text-anchor="middle">policy-gated buy</text>
  <text class="label" x="702" y="315" text-anchor="middle">NAV accrual</text>
  <text class="label" x="326" y="370" text-anchor="middle">hold / exit if enabled</text>
</svg>
