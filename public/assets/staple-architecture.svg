<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">STAPLE protocol architecture</title>
  <desc id="desc">Layered architecture showing release-gated entry, accounting core, oracle safety, strategy adapters if active, execution modules, and governance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 2; }
      .core { fill: #e8f7ef; stroke: #1f9d55; stroke-width: 2; }
      .safety { fill: #fff6d8; stroke: #d4a017; stroke-width: 2; }
      .entry { fill: #e8f1ff; stroke: #1f6feb; stroke-width: 2; }
      .exec { fill: #fff0df; stroke: #f7931a; stroke-width: 2; }
      .gov { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2; }
      .title { font: 700 17px Inter, Arial, sans-serif; fill: #111827; }
      .body { font: 13px Inter, Arial, sans-serif; fill: #526071; }
      .layer { font: 700 14px Inter, Arial, sans-serif; fill: #334155; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="640" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">STAPLE Protocol Architecture</text>
  <text x="60" y="88" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5b6472">Separated release-gated entry, accounting, oracle, strategy-if-active, execution, and governance surfaces.</text>

  <rect class="entry" x="70" y="140" width="210" height="100" rx="14"/>
  <text class="title" x="175" y="178" text-anchor="middle">Release-Gated Entry</text>
  <text class="body" x="175" y="204" text-anchor="middle">StapleATM</text>
  <text class="body" x="175" y="224" text-anchor="middle">DepositQueue</text>

  <rect class="core" x="370" y="130" width="240" height="120" rx="14"/>
  <text class="title" x="490" y="171" text-anchor="middle">Accounting Core</text>
  <text class="body" x="490" y="198" text-anchor="middle">RIAVault</text>
  <text class="body" x="490" y="218" text-anchor="middle">StapleToken</text>
  <text class="body" x="490" y="238" text-anchor="middle">internalBalance / NAV</text>

  <rect class="safety" x="700" y="130" width="250" height="120" rx="14"/>
  <text class="title" x="825" y="171" text-anchor="middle">Price Safety</text>
  <text class="body" x="825" y="198" text-anchor="middle">OracleSentinel</text>
  <text class="body" x="825" y="218" text-anchor="middle">Chainlink + TWAP</text>
  <text class="body" x="825" y="238" text-anchor="middle">bounds / heartbeat / health</text>

  <rect class="panel" x="250" y="335" width="250" height="115" rx="14"/>
  <text class="title" x="375" y="374" text-anchor="middle">Strategy Adapters</text>
  <text class="body" x="375" y="401" text-anchor="middle">Aave V3 if active</text>
  <text class="body" x="375" y="421" text-anchor="middle">Spark if active</text>
  <text class="body" x="375" y="441" text-anchor="middle">Compound V3 if active</text>

  <rect class="exec" x="600" y="335" width="260" height="115" rx="14"/>
  <text class="title" x="730" y="374" text-anchor="middle">Execution</text>
  <text class="body" x="730" y="401" text-anchor="middle">RIAVaultKeeper</text>
  <text class="body" x="730" y="421" text-anchor="middle">RIAVaultSwap</text>
  <text class="body" x="730" y="441" text-anchor="middle">HybridRebalancer / DirectSwapGuard</text>

  <rect class="gov" x="370" y="510" width="390" height="82" rx="14"/>
  <text class="title" x="565" y="544" text-anchor="middle">Governance and Operations</text>
  <text class="body" x="565" y="570" text-anchor="middle">Governor, Timelock, Guardian, Keeper, Rebalancer roles</text>

  <path class="line" d="M 280 190 L 362 190"/>
  <path class="line" d="M 610 190 L 692 190"/>
  <path class="line" d="M 490 250 L 420 327"/>
  <path class="line" d="M 565 250 L 680 327"/>
  <path class="line" d="M 500 450 L 530 502"/>
  <path class="line" d="M 690 450 L 625 502"/>
  <path class="line" d="M 825 250 C 900 360 860 470 760 530"/>

  <text class="layer" x="320" y="174" text-anchor="middle">asset entry if enabled</text>
  <text class="layer" x="651" y="174" text-anchor="middle">prices</text>
  <text class="layer" x="435" y="300" text-anchor="middle">deploy if active</text>
  <text class="layer" x="641" y="300" text-anchor="middle">harvest / swap if active</text>
</svg>
